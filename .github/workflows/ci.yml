name: CI

on:
  push:
    branches:
      - main
      - "phase-1/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Restore
        run: dotnet restore Ecommerce.sln

      - name: Build
        run: dotnet build Ecommerce.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Ecommerce.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
