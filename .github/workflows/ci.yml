name: CI

on:
  push:
    branches:
      - main
      - "phase-*/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Restore
        run: dotnet restore Ecommerce.sln

      - name: Build
        run: dotnet build Ecommerce.sln --configuration Release --no-restore

      - name: Test
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=ecommerce_test;Username=ecommerce;Password=ci-only-password;Timeout=5;Command Timeout=5
        run: dotnet test Ecommerce.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Build and start Docker Compose
        env:
          POSTGRES_PASSWORD: compose-ci-only-password
        run: docker compose up --build --detach

      - name: Verify API liveness, readiness, and OpenAPI
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health/live; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "API liveness endpoint did not become healthy in time."
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent http://localhost:8080/health/ready
          curl --fail --silent http://localhost:8080/openapi/v1.json > /dev/null

      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans
