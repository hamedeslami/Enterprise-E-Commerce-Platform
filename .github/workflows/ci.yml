name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "phase-*/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ecommerce:ci-only-password@127.0.0.1:5432/ecommerce_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and generate bootstrap lockfile
        run: npm install --no-audit --no-fund

      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-bootstrap-package-lock
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 2

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL-backed HTTP tests
        run: npm run test:e2e

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Build and start Docker Compose
        run: docker compose up --build --detach

      - name: Verify liveness, readiness, and OpenAPI
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/health/live; then
              break
            fi

            if [ "$attempt" -eq 45 ]; then
              echo "API liveness endpoint did not become healthy in time."
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent http://localhost:8080/health/ready
          curl --fail --silent http://localhost:8080/openapi/v1.json > /dev/null

      - name: Verify readiness fails when PostgreSQL is unavailable
        shell: bash
        run: |
          set -euo pipefail
          docker compose stop postgres
          status="000"

          for attempt in {1..15}; do
            status="$(curl --silent --output /tmp/readiness.json --write-out '%{http_code}' http://localhost:8080/health/ready || true)"
            if [ "$status" = "503" ]; then
              break
            fi
            sleep 2
          done

          if [ "$status" != "503" ]; then
            echo "Expected readiness HTTP 503 after PostgreSQL stopped; got $status."
            cat /tmp/readiness.json || true
            exit 1
          fi

          curl --fail --silent http://localhost:8080/health/live > /dev/null

      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans
